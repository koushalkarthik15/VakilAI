name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MOCK_AI_PROVIDERS: 'true'
      MONGODB_URI: 'mongodb://127.0.0.1:27017/vakil_e2e_test'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Seed Legal KB (Test Database)
        run: npm run db:seed

      - name: Run Typecheck
        run: npm run type-check

      - name: Run Lint
        run: npm run lint

      - name: Run Unit and Integration Tests
        run: npm run test

      - name: Run E2E Tests
        run: npx playwright test

      - name: Production Build
        run: npm run build
